<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PicMap Layout Editor</title>
<style>
  @font-face { font-family: 'DM Sans'; src: url('assets/fonts/DMSans-400.ttf'); font-weight: 400; }
  @font-face { font-family: 'DM Sans'; src: url('assets/fonts/DMSans-500.ttf'); font-weight: 500; }
  @font-face { font-family: 'DM Sans'; src: url('assets/fonts/DMSans-Italic400.ttf'); font-style: italic; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; font-family: 'DM Sans', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #2b2822; color: #F5F0E8; }

  #topbar {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: #1d1b17; border-bottom: 1px solid #3a352c; flex: 0 0 auto;
  }
  #topbar h1 { font-size: 15px; font-weight: 500; margin-right: 8px; }
  #topbar .hint { font-size: 11.5px; color: #9a917f; }
  #topbar button {
    font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 7px;
    border: 1px solid #57503f; background: #37332a; color: #F5F0E8; cursor: pointer;
  }
  #topbar button:hover { background: #454033; }
  #topbar button.primary { background: #D96F47; border-color: #D96F47; color: #fff; }
  #topbar button.primary:hover { background: #c25f3a; }
  #topbar button:disabled { opacity: 0.45; cursor: default; }
  #status { font-size: 12px; margin-left: auto; color: #9a917f; }
  #status.dirty { color: #F4C842; }
  #status.ok { color: #8fbf6f; }
  #status.err { color: #e07070; }

  #main { display: flex; flex: 1 1 auto; min-height: 0; }
  #canvas-wrap { flex: 1 1 auto; min-width: 0; position: relative; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; background: #D8D2BA; }
  #map.panning { cursor: grabbing; }
  #map.placing { cursor: crosshair; }

  #panel {
    flex: 0 0 300px; overflow-y: auto; background: #24211b;
    border-left: 1px solid #3a352c; padding: 10px 12px; font-size: 12.5px;
  }
  #panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
              color: #9a917f; margin: 14px 0 5px; }
  #panel h2:first-child { margin-top: 2px; }
  .item { padding: 3px 7px; border-radius: 5px; cursor: pointer; display: flex;
          justify-content: space-between; gap: 6px; }
  .item:hover { background: #322d24; }
  .item.selected { background: #4a3527; color: #F4C842; }
  .item .kind { color: #7a7263; font-size: 11px; }

  #props { position: sticky; bottom: 0; background: #24211b; border-top: 1px solid #3a352c;
           margin: 10px -12px -10px; padding: 10px 12px 12px; }
  #props .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
  #props label { flex: 0 0 44px; color: #9a917f; font-size: 11.5px; }
  #props input[type=number], #props input[type=text], #props select {
    flex: 1 1 auto; width: 60px; font: inherit; font-size: 12px; padding: 3px 6px;
    background: #37332a; border: 1px solid #57503f; border-radius: 5px; color: #F5F0E8;
  }
  #props .btnrow { display: flex; gap: 6px; margin-top: 8px; }
  #props .btnrow button { flex: 1; font: inherit; font-size: 12px; padding: 4px;
    border-radius: 6px; border: 1px solid #57503f; background: #37332a;
    color: #F5F0E8; cursor: pointer; }
  #props .btnrow button.danger { border-color: #7a4040; color: #e09090; }
  #props .empty { color: #7a7263; font-size: 12px; padding: 4px 0; }

  .addrow { display: flex; gap: 6px; margin-top: 4px; }
  .addrow select { flex: 1; font: inherit; font-size: 12px; background: #37332a;
    border: 1px solid #57503f; border-radius: 5px; color: #F5F0E8; padding: 3px; }
  .addrow button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid #57503f; background: #37332a; color: #F5F0E8; cursor: pointer; }

  #editStops { display: flex; align-items: center; gap: 6px; font-size: 12px;
               color: #c9c0ae; margin-top: 6px; }

  /* SVG element styles */
  .state { fill: #F6EFE0; stroke: #C3B294; stroke-width: 0.9; }
  .route { fill: none; stroke: #D96F47; stroke-width: 4.2; stroke-linecap: round;
           stroke-linejoin: round; }
  .daydot { fill: #C77B54; opacity: 0.6; }
  .lake { fill: #D8D2BA; stroke: #A5947A; stroke-width: 1.1; cursor: move; }
  .glyph { cursor: move; }
  .glyph .shape { fill: none; stroke: #8E7E66; stroke-width: 1.6; stroke-linecap: round;
                  stroke-linejoin: round; }
  .glyph.big .shape { stroke-width: 2.1; }
  .glyph .hit { fill: transparent; }
  .ov-marker { fill: #EFBE3F; stroke: #3A342B; stroke-width: 1.5; }
  .ov-marker.editable { cursor: move; }
  .wp-marker { fill: #C77B54; stroke: #3A342B; stroke-width: 0.9; cursor: move; }
  .lbl { fill: #3A342B; cursor: move; user-select: none;
         paint-order: stroke; stroke: #F6EFE0; stroke-width: 3px; }
  .lbl.bold { font-weight: 500; }
  .lbl.park { font-style: italic; fill: #6B5D49; }
  .lbl.wp { fill: #6B5D49; }
  .sub { fill: #6B5D49; pointer-events: none;
         paint-order: stroke; stroke: #F6EFE0; stroke-width: 2.5px; }
  .sel-ring { fill: none; stroke: #D96F47; stroke-width: 1.4; stroke-dasharray: 4 3;
              pointer-events: none; }
</style>
</head>
<body>
  <div id="topbar">
    <h1>PicMap Layout Editor</h1>
    <button id="btnUndo" title="Ctrl+Z">Undo</button>
    <button id="btnRedo" title="Ctrl+Y">Redo</button>
    <button id="btnSave" class="primary" title="Ctrl+S">Save</button>
    <button id="btnRender">Render poster</button>
    <a id="previewLink" href="output/print/preview.png" target="_blank"
       style="color:#9a917f; font-size:12px;">open last render</a>
    <span class="hint">drag labels &amp; glyphs · wheel = zoom · drag background = pan</span>
    <span id="status">loading…</span>
  </div>
  <div id="main">
    <div id="canvas-wrap">
      <svg id="map" viewBox="0 0 2400 1200" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="panel">
      <h2>Stop labels</h2><div id="list-labels"></div>
      <label id="editStops"><input type="checkbox" id="chkEditStops">
        allow dragging stop markers (edits corrected lat/lon)</label>
      <h2>Parks &amp; features</h2><div id="list-parks"></div>
      <h2>Glyphs</h2><div id="list-glyphs"></div>
      <div class="addrow">
        <select id="addKind">
          <option value="mountain">+ mountain</option>
          <option value="mountain-big">+ mountain (Rockies)</option>
          <option value="conifer">+ conifers</option>
          <option value="broadleaf">+ broadleaf</option>
          <option value="park">+ park (labeled)</option>
          <option value="waypoint">+ waypoint city</option>
        </select>
        <button id="btnAdd">Place</button>
      </div>
      <h2>Hidden stops</h2><div id="list-hidden"></div>
      <div id="props"><div class="empty">Nothing selected</div></div>
    </div>
  </div>
  <script src="map_editor.js"></script>
</body>
</html>
